<!DOCTYPE html>
<html>
    <head>
        <title>Import Video Watchtime Data</title>
        <style>
            body {
                width: 480px;
                margin: 40px auto;
                padding: 8px;
                font-family: Arial, sans-serif;
                font-size: 13px;
                background: #1e1e24;
                color: #e0e0e0;
            }

            .h2-container {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 16px;
                padding: 12px 6px;
                border-radius: 12px;
                box-shadow: inset 3px 3px 7px rgba(0, 0, 0, 0.5), inset -3px -3px 7px rgba(70, 70, 90, 0.3);
            }

            .h2-icon {
                width: 24px;
                height: 24px;
            }

            h2 {
                margin: 0;
                font-size: 16px;
            }

            .stats-card {
                background: #252530;
                border-radius: 12px;
                padding: 16px;
                margin-bottom: 12px;
                box-shadow: inset 3px 3px 7px rgba(0, 0, 0, 0.5), inset -3px -3px 7px rgba(70, 70, 90, 0.3);
            }

            .stats-card p {
                margin: 8px 0;
                line-height: 1.5;
            }

            input[type="file"] {
                display: block;
                margin: 12px 0;
                color: #e0e0e0;
            }

            button {
                font-size: 13px;
                padding: 10px 18px;
                border: none;
                border-radius: 8px;
                background: #2a2a35;
                color: #e0e0e0;
                cursor: pointer;
                transition: all 0.3s;
                box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5), -4px -4px 8px rgba(70, 70, 90, 0.3);
            }

            button:hover:not(:disabled) {
                background: #323245;
                box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5), -3px -3px 5px rgba(70, 70, 90, 0.3);
            }

            button:active:not(:disabled) {
                box-shadow: inset 3px 3px 7px rgba(0, 0, 0, 0.5), inset -3px -3px 7px rgba(70, 70, 90, 0.3);
            }

            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            #status {
                margin-top: 12px;
                font-size: 13px;
            }

            #status.success {
                color: #6ee7a0;
            }

            #status.error {
                color: #ff8a8a;
            }
        </style>
    </head>
    <body>
        <div class="h2-container">
            <img src="icons/icon128.png" alt="Icon" class="h2-icon">
            <h2>Import Video Watchtime Data</h2>
        </div>
        <div class="stats-card">
            <p>Select a JSON file previously exported from Video Analytics. Imported data is merged with what's already stored — existing days are added to, not overwritten.</p>
            <input type="file" id="importFile" accept=".json">
            <button id="importBtn" disabled>Import</button>
            <div id="status"></div>
        </div>
        <script src="import.js"></script>
    </body>
</html>
